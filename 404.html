<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found | Zap Funds</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png">
  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=40">
  <script>
    // Legacy .html URLs redirect to their clean equivalents
    (function () {
      var path = window.location.pathname;
      var redirects = {
        "/blog/invoice-finance-demand-2026": "/blog/",
        "/blog/cash-flow-squeeze-2026": "/blog/",
        "/blog/invoice-finance-vs-business-loans": "/blog/"
      };
      if (redirects[path]) { window.location.replace(redirects[path]); return; }
      if (!path.endsWith(".html")) { return; }
      var clean = path.replace(/\.html$/, "");
      if (clean === "/index") { clean = "/"; }
      window.location.replace(clean);
    })();
  </script>
</head>
<body>
  <main id="main">
    <section class="section page-section">
      <div class="container legal-page">
        <p class="section-label">404</p>
        <h1 class="section-heading page-heading">Wrong turn.</h1>
        <div class="how-copy">
          <p class="how-text">That page doesn't exist. The good news: everything you need is one click away.</p>
          <p><a class="btn btn-primary" href="/">Back to Zap Funds</a>
            <a class="btn btn-ghost" href="/blog/" style="margin-left: 0.75rem;">Read the blog</a></p>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
